[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-lab"
version = "0.1.0"
description = "Reproducible optimization experiments for Assignment 8"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
scientific = [
  "matplotlib==3.10.7",
  "numpy==2.3.5",
  "scipy==1.16.3",
]
ml = ["torch==2.10.0"]
quantum = ["pennylane==0.45.1"]
database = []

[project.scripts]
optlab = "optlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "slow: opt-in long-running experiment",
  "external: requires an external toolchain or service",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
